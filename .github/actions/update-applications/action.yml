name: 'Update Applications'
description: 'Update Argo CD applications with new image digests'
inputs:
  components:
    description: 'JSON array of component configurations'
    required: true
  digests-json:
    description: 'JSON object of component digests'
    required: true
  repository-owner:
    description: 'GitHub repository owner'
    required: true
  repository-name:
    description: 'GitHub repository name'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Update Applications
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        DIGESTS_JSON: ${{ inputs.digests-json }}
        OWNER: ${{ inputs.repository-owner }}
        REPO: ${{ inputs.repository-name }}
      run: |
        set -euo pipefail
        
        # Validate inputs
        if [ -z "$COMPONENTS" ] || [ -z "$DIGESTS_JSON" ]; then
          echo "Error: Missing required inputs"
          exit 1
        fi
        
        # Process each component
        echo "$COMPONENTS" | jq -c '.[]' | while read -r component_data; do
          component=$(echo "$component_data" | jq -r '.component')
          application_files=$(echo "$component_data" | jq -r '.application_files // empty')
          
          if [ -n "$application_files" ]; then
            digest=$(echo "$DIGESTS_JSON" | jq -r ".$component // empty")
            
            if [ -n "$digest" ] && [ "$digest" != "null" ]; then
              echo "Processing component: $component with digest: $digest"
              
              # Update each application file for this component
              echo "$application_files" | jq -r '.[]' | while read -r app_file; do
                if [ -n "$app_file" ] && [ -f "$app_file" ]; then
                  echo "Updating $app_file for component $component"
                  repo="ghcr.io/$OWNER/$REPO/$component"
                  
                  # Update the application file
                  CURRENT_VALUES=$(yq '.spec.source.helm.values' "$app_file")
                  UPDATED_VALUES=$(echo "$CURRENT_VALUES" | yq ".image.digest = \"$digest\" | .image.repository = \"$repo\"")
                  yq -i ".spec.source.helm.values = strenv(UPDATED_VALUES)" "$app_file"
                else
                  echo "Warning: Application file $app_file not found or empty"
                fi
              done
            else
              echo "Warning: No digest found for component $component"
            fi
          fi
        done
