name: 'Release Please: Helm (reusable)'

on:
  workflow_call:
    inputs:
      manifest_file:
        default: .release-please-manifest.json
        type: string
      config_file:
        default: .github/release-please-config.json
        type: string
      chart_name:
        description: 'Chart name (e.g., captide-document-engine)'
        required: true
        type: string
    secrets:
      CAPTIDE_APP_ID:
        required: true
      CAPTIDE_APP_PRIVATE_KEY:
        required: true
    outputs:
      chart_release_created:
        value: ${{ jobs.rp.outputs.chart_release_created }}
      chart_tag_name:
        value: ${{ jobs.rp.outputs.chart_tag_name }}

jobs:
  rp:
    runs-on: ubuntu-latest
    outputs:
      chart_release_created: ${{ steps.rp.outputs.release_created }}
      chart_tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CAPTIDE_APP_ID }}
          private-key: ${{ secrets.CAPTIDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          # Force the caller repo + exact ref
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Sanity check
        run: |
          echo "Checked out ${{ github.repository }} @ ${{ github.sha }}"
          ls -la .
          echo "CONFIG_FILE=${{ inputs.config_file }}"
          echo "MANIFEST_FILE=${{ inputs.manifest_file }}"
          test -f "${{ inputs.config_file }}" || (echo "Config missing" && ls -la .github || true)
          test -f "${{ inputs.manifest_file }}" || (echo "Manifest missing" && ls -la || true)

      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          manifest-file: ${{ inputs.manifest_file }}
          config-file: ${{ inputs.config_file }}
          token: ${{ steps.app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Debug Release Please outputs
        run: |
          echo "All Release Please outputs:"
          echo "release_created: ${{ steps.rp.outputs.release_created }}"
          echo "tag_name: ${{ steps.rp.outputs.tag_name }}"
