name: 'Helm: Build and Publish Chart (reusable)'

on:
  workflow_call:
    inputs:
      chart_path: { required: true, type: string }
      chart_name: { required: true, type: string }
      chart_tag_name: { required: false, type: string }
    secrets:
      GHCR_TOKEN:
        required: false
        description: "PAT with packages:write, used instead of GITHUB_TOKEN when provided"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Helm
        run: |
          set -e
          
          # Check if Helm is already installed
          if command -v helm &> /dev/null; then
            echo "Helm is already installed: $(helm version --short)"
            exit 0
          fi
          
          # Try snap first (fastest on Ubuntu)
          if command -v snap &> /dev/null; then
            echo "Installing Helm via snap..."
            sudo snap install helm --classic && helm version --short && exit 0
          fi
          
          # Fallback: Try direct download from GitHub releases (more reliable than get.helm.sh)
          echo "Installing Helm via GitHub releases..."
          HELM_VERSION="3.14.4"
          curl -fsSL --max-time 90 --retry 5 --retry-delay 3 \
            "https://github.com/helm/helm/releases/download/v${HELM_VERSION}/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            -o helm.tar.gz
          
          tar -zxvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          sudo chmod +x /usr/local/bin/helm
          
          # Verify installation
          helm version --short
          echo "Helm ${HELM_VERSION} installed successfully"
      - name: Extract released version
        id: v
        run: |
          if [ -n "${{ inputs.chart_tag_name }}" ]; then
            base_ver=$(echo '${{ inputs.chart_tag_name }}' | sed -E 's/^.*-v(.*)$/\1/')
          else
            # Use chart version from Chart.yaml if no tag provided
            base_ver=$(grep '^version:' "${{ inputs.chart_path }}/Chart.yaml" | awk '{print $2}' | tr -d '"')
          fi
          echo "CHART_VERSION=$base_ver" >> $GITHUB_OUTPUT
      - name: Login to GHCR (OCI)
        run: |
          TOKEN="${{ secrets.GHCR_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Helm deps
        run: helm dependency update "${{ inputs.chart_path }}" || true
      - name: Package chart
        run: helm package "${{ inputs.chart_path }}" --version "${{ steps.v.outputs.CHART_VERSION }}"
      - name: Push chart
        run: |
          CHART_PKG=$(ls ${{ inputs.chart_name }}-*.tgz)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "$CHART_PKG" oci://ghcr.io/${OWNER}/charts
