name: 'Helm: Build and Publish Chart (reusable)'

on:
  workflow_call:
    inputs:
      chart_path: { required: true, type: string }
      chart_name: { required: true, type: string }
      chart_tag_name: { required: false, type: string }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Helm
        run: |
          set -e
          HELM_VERSION="3.16.3"
          # Try GitHub releases first (more reliable than get.helm.sh)
          for url in \
            "https://github.com/helm/helm/releases/download/v${HELM_VERSION}/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"; do
            echo "Attempting to download Helm from: $url"
            if curl -fsSL --max-time 30 --retry 3 --retry-delay 5 "$url" -o helm.tar.gz; then
              echo "Download successful from $url"
              break
            else
              echo "Download failed from $url, trying next source..."
            fi
          done
          if [ ! -f helm.tar.gz ]; then
            echo "Error: Failed to download Helm from all sources"
            exit 1
          fi
          tar -zxvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: Extract released version
        id: v
        run: |
          if [ -n "${{ inputs.chart_tag_name }}" ]; then
            base_ver=$(echo '${{ inputs.chart_tag_name }}' | sed -E 's/^.*-v(.*)$/\1/')
          else
            # Use chart version from Chart.yaml if no tag provided
            base_ver=$(grep '^version:' "${{ inputs.chart_path }}/Chart.yaml" | awk '{print $2}' | tr -d '"')
          fi
          echo "CHART_VERSION=$base_ver" >> $GITHUB_OUTPUT
      - name: Login to GHCR (OCI)
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Helm deps
        run: helm dependency update "${{ inputs.chart_path }}" || true
      - name: Package chart
        run: helm package "${{ inputs.chart_path }}" --version "${{ steps.v.outputs.CHART_VERSION }}"
      - name: Push chart
        run: |
          CHART_PKG=$(ls ${{ inputs.chart_name }}-*.tgz)
          helm push "$CHART_PKG" oci://ghcr.io/${{ github.repository_owner }}/charts
