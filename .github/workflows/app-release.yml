name: App Release (reusable)

on:
  workflow_call:
    inputs:
      components:
        description: 'JSON array of {component}'
        required: true
        type: string

jobs:
  retag-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(inputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          ver=$(echo "$GITHUB_REF_NAME" | sed -E 's/^.*-v(.*)$/\1/')
          echo "ver=$ver" >> $GITHUB_OUTPUT
          echo "ver_mm=$(echo "$ver" | awk -F. '{print $1"."$2}')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag existing image to semver tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          SRC=ghcr.io/$OWNER/${{ github.event.repository.name }}/${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}
          DST_BASE=ghcr.io/$OWNER/${{ github.event.repository.name }}/${{ matrix.component }}
          docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver }}" "$SRC"
          docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_mm }}" "$SRC"
