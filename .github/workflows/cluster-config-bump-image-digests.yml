name: 'Cluster Config: Bump Image Digests (reusable)'

on:
  workflow_call:
    inputs:
      components_matrix:
        description: 'JSON array of component configurations'
        required: true
        type: string
      image_digests_json:
        description: 'JSON object of component -> image digest'
        required: true
        type: string
      # NEW (either/or, pick what fits you best):
      release_version:
        description: 'Semver to stamp as image tag (e.g., 1.8.0-rc.1)'
        required: false
        type: string
      image_tags_json:
        description: 'JSON: component -> image tag (e.g., {"api":"1.8.0-rc.1"})'
        required: false
        type: string
      environment:
        description: 'Target environment (e.g., dev)'
        required: false
        default: 'dev'
        type: string
      app_name:
        description: 'Logical app name (e.g., captide-document-engine)'
        required: true
        type: string
      pr_title:
        description: 'Override PR title'
        required: false
        type: string
      pr_body:
        description: 'Override PR body'
        required: false
        type: string
      # NEW: Renovate integration
      renovate_enabled:
        description: 'Whether to enable Renovate-style updates'
        required: false
        default: 'false'
        type: string
    secrets:
      CAPTIDE_APP_ID:
        required: true
      CAPTIDE_APP_PRIVATE_KEY:
        required: true

jobs:
  update-cluster:
    name: Update ${{ inputs.environment }} cluster configuration
    runs-on: ubuntu-latest
    concurrency:
      group: autobump-${{ inputs.environment }}-${{ inputs.app_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Compute repo name
        id: repo
        run: echo "repo_name=captide-cluster-config" >> $GITHUB_OUTPUT

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CAPTIDE_APP_ID }}
          private-key: ${{ secrets.CAPTIDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.repo_name }}

      - name: Checkout cluster config repository
        uses: actions/checkout@v4
        with:
          repository: Model-ML/captide-cluster-config
          token: ${{ steps.app-token.outputs.token }}
          path: cfg

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Values Files
        working-directory: cfg
        env:
          IMAGE_DIGESTS: ${{ inputs.image_digests_json }}
          IMAGE_TAGS: ${{ inputs.image_tags_json }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMPONENTS_MATRIX: ${{ inputs.components_matrix }}
          RENOVATE_ENABLED: ${{ inputs.renovate_enabled }}
        run: |
          set -euo pipefail
          
          # Validate inputs
          if [ -z "$COMPONENTS_MATRIX" ] || [ -z "$IMAGE_DIGESTS" ]; then
            echo "Error: Missing required inputs"
            exit 1
          fi
          
          # Iterate components safely
          jq -c '.[]' <<< "$COMPONENTS_MATRIX" | while read -r component_data; do
            component=$(jq -r '.component' <<< "$component_data")
            
            digest=$(jq -r --arg c "$component" '.[$c] // empty' <<< "$IMAGE_DIGESTS")
            
            # decide tag (component-specific > release_version)
            if [ -z "${IMAGE_TAGS:-}" ]; then
              tag=""
            else
              tag=$(jq -r --arg c "$component" '.[$c] // empty' <<< "$IMAGE_TAGS" 2>/dev/null || echo "")
            fi
            if [ -z "$tag" ] && [ -n "${RELEASE_VERSION:-}" ]; then
              tag="$RELEASE_VERSION"
            fi
            
            if [ -n "$digest" ] && [ "$digest" != "null" ]; then
              echo "Processing component: $component with digest: $digest${tag:+ and tag: $tag}"
              
              # Iterate values files directly from JSON (for multi-source ArgoCD)
              jq -r '.values_files[]?' <<< "$component_data" | while read -r values_file; do
                [ -z "$values_file" ] && continue
                [ ! -f "$values_file" ] && { echo "Warning: $values_file not found"; continue; }
                
                echo "Updating $values_file for component $component"
                
                # Update image digest
                yq -i ".image.digest = \"$digest\"" "$values_file"
                
                # Update image tag if provided
                if [ -n "$tag" ]; then
                  yq -i ".image.tag = \"$tag\"" "$values_file"
                fi
                
                # Update image repository (construct from component name). Lowercased because
                # GHCR rejects uppercase repository names and the org slug may be mixed-case.
                owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                repo_lc=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
                repo="ghcr.io/$owner_lc/$repo_lc/$component"
                yq -i ".image.repository = \"$repo\"" "$values_file"
                
                # Add Renovate annotation if enabled
                if [ "$RENOVATE_ENABLED" = "true" ]; then
                  # Add renovate: datasource=docker depName=ghcr.io/... annotation
                  yq -i '.image.repository = .image.repository + " # renovate: datasource=docker depName=" + .image.repository' "$values_file"
                fi
                
                echo "✅ Updated $values_file"
              done
            else
              echo "Warning: No digest found for component $component"
            fi
          done

      - name: Prepare PR metadata
        id: pr-meta
        run: |
          # Default PR title and body if not provided
          if [ -z "${{ inputs.pr_title }}" ]; then
            echo "pr_title=chore(${{ inputs.environment }}): bump ${{ inputs.app_name }} image digests" >> $GITHUB_OUTPUT
          else
            echo "pr_title=${{ inputs.pr_title }}" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "${{ inputs.pr_body }}" ]; then
            echo "pr_body=Automated image digest update for ${{ inputs.environment }} environment. This PR updates image digests and tags for ${{ inputs.app_name }} components. All changes are automatically tested and validated. This update is compatible with Renovate for future automated dependency management." >> $GITHUB_OUTPUT
          else
            echo "pr_body=${{ inputs.pr_body }}" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: cfg
          token: ${{ steps.app-token.outputs.token }}
          commit-message: ${{ steps.pr-meta.outputs.pr_title }}
          title: ${{ steps.pr-meta.outputs.pr_title }}
          body: ${{ steps.pr-meta.outputs.pr_body }}
          branch: autobump/${{ inputs.environment }}/${{ inputs.app_name }}-images
          delete-branch: false
          base: main
          labels: |
            auto-merge:${{ inputs.environment }}
            area:images
            dependencies
