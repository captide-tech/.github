name: Helm Publish (reusable)

on:
  workflow_call:
    inputs:
      chart_path: { required: true, type: string }
      chart_name: { required: true, type: string }
      chart_tag_name: { required: true, type: string }
      release_type:
        description: 'Type of release: rc or ga'
        default: 'rc'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Extract released version
        id: v
        run: |
          base_ver=$(echo '${{ inputs.chart_tag_name }}' | sed -E 's/^.*-v(.*)$/\1/')
          
          # Add RC suffix if this is an RC release
          if [ "${{ inputs.release_type }}" = "rc" ]; then
            echo "CHART_VERSION=${base_ver}-rc" >> $GITHUB_OUTPUT
          else
            echo "CHART_VERSION=$base_ver" >> $GITHUB_OUTPUT
          fi
      - name: Login to GHCR (OCI)
        run: echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Helm deps
        run: helm dependency update "${{ inputs.chart_path }}" || true
      - name: Package chart
        run: helm package "${{ inputs.chart_path }}" --version "${{ steps.v.outputs.CHART_VERSION }}"
      - name: Push chart
        run: |
          CHART_PKG=$(ls ${{ inputs.chart_name }}-*.tgz)
          helm push "$CHART_PKG" oci://ghcr.io/${{ github.repository_owner }}/charts
