name: GA Promotion (reusable)

on:
  workflow_call:
    inputs:
      cluster_config_repo:
        description: 'Full name org/repo of cluster-config'
        required: true
        type: string
      application_files:
        description: 'JSON array of application file paths to update in production'
        required: true
        type: string
      chart_name:
        description: 'Chart name for promotion'
        required: true
        type: string
      cluster_config_base:
        description: 'Base branch for PR'
        required: false
        default: 'main'
        type: string
    secrets:
      CAPTIDE_APP_ID:
        required: true
      CAPTIDE_APP_PRIVATE_KEY:
        required: true

jobs:
  promote-to-ga:
    name: Promote RC to GA and update production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Compute repo name
        id: repo
        shell: bash
        run: echo "repo_name=${{ inputs.cluster_config_repo }}" | awk -F/ '{print "repo_name="$$2}' >> $GITHUB_OUTPUT
      
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CAPTIDE_APP_ID }}
          private-key: ${{ secrets.CAPTIDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.repo_name }}
      
      - name: Checkout cluster config
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cluster_config_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: cfg
      
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Get current dev versions
        working-directory: cfg
        id: dev-versions
        env:
          APPLICATION_FILES: ${{ inputs.application_files }}
        run: |
          # Extract current versions from dev applications
          echo "{" > dev-versions.json
          first=true
          echo "$APPLICATION_FILES" | jq -r '.[]' | while read -r app_file; do
            if [ -n "$app_file" ] && [ -f "$app_file" ]; then
              # Get current chart version and image digest
              chart_ver=$(yq '.spec.source.targetRevision' "$app_file")
              image_digest=$(yq '.spec.source.helm.values | fromyaml | .image.digest' "$app_file")
              image_repo=$(yq '.spec.source.helm.values | fromyaml | .image.repository' "$app_file")
              
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> dev-versions.json
              fi
              echo "  \"$app_file\": {\"chart_version\": \"$chart_ver\", \"image_digest\": \"$image_digest\", \"image_repo\": \"$image_repo\"}" >> dev-versions.json
            fi
          done
          echo "}" >> dev-versions.json
          
          # Store for later use
          echo "dev_versions=$(cat dev-versions.json | jq -c .)" >> $GITHUB_OUTPUT
      
      - name: Update production applications
        working-directory: cfg
        env:
          APPLICATION_FILES: ${{ inputs.application_files }}
          DEV_VERSIONS: ${{ steps.dev-versions.outputs.dev_versions }}
        run: |
          # Update each production application with dev versions
          echo "$APPLICATION_FILES" | jq -r '.[]' | while read -r app_file; do
            if [ -n "$app_file" ] && [ -f "$app_file" ]; then
              echo "Updating production $app_file with dev versions"
              
              # Get dev versions for this file
              chart_ver=$(echo "$DEV_VERSIONS" | jq -r ".$app_file.chart_version")
              image_digest=$(echo "$DEV_VERSIONS" | jq -r ".$app_file.image_digest")
              image_repo=$(echo "$DEV_VERSIONS" | jq -r ".$app_file.image_repo")
              
              if [ "$chart_ver" != "null" ] && [ -n "$chart_ver" ]; then
                # Update chart version
                yq -i "(.spec.source.targetRevision) = \"$chart_ver\"" "$app_file"
              fi
              
              if [ "$image_digest" != "null" ] && [ -n "$image_digest" ]; then
                # Update image digest and repository
                CURRENT_VALUES=$(yq '.spec.source.helm.values' "$app_file")
                UPDATED_VALUES=$(echo "$CURRENT_VALUES" | yq ".image.digest = \"$image_digest\" | .image.repository = \"$image_repo\"")
                yq -i ".spec.source.helm.values = strenv(UPDATED_VALUES)" "$app_file"
              fi
            fi
          done
      
      - name: Create production PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: cfg
          token: ${{ steps.app-token.outputs.token }}
          commit-message: |
            feat(prod): promote to GA from dev
          title: "feat(prod): promote to GA from dev"
          body: |
            GA promotion. This updates production with the latest stable versions from dev.
          branch: autobump/prod
          delete-branch: false
          base: ${{ inputs.cluster_config_base }}
