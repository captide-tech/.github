name: Cluster Update (reusable)

on:
  workflow_call:
    inputs:
      cluster_config_repo:
        description: 'Full name org/repo of cluster-config'
        required: true
        type: string
      components:
        description: 'JSON array of component configurations'
        required: true
        type: string
      digests_json:
        description: 'JSON object of component digests'
        required: true
        type: string
      cluster_config_base:
        description: 'Base branch for PRs'
        required: false
        default: 'main'
        type: string
      pr_title:
        description: 'Title for the PR'
        required: false
        default: 'chore(dev): bump image digests'
        type: string
      pr_body:
        description: 'Body for the PR'
        required: false
        default: 'Dev deploy bump. This PR updates per-component image repositories and digests.'
        type: string
    secrets:
      CAPTIDE_APP_ID:
        required: true
      CAPTIDE_APP_PRIVATE_KEY:
        required: true

jobs:
  update-cluster:
    name: Update cluster configuration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Compute repo name
        id: repo
        run: echo "repo_name=${{ inputs.cluster_config_repo }}" | awk -F/ '{print "repo_name="$$2}' >> $GITHUB_OUTPUT

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CAPTIDE_APP_ID }}
          private-key: ${{ secrets.CAPTIDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repo.outputs.repo_name }}

      - name: Checkout cluster config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.cluster_config_repo }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install yq
        uses: ./.github/actions/install-yq

      - name: Update Applications
        uses: ./.github/actions/update-applications
        with:
          components: ${{ inputs.components }}
          digests-json: ${{ inputs.digests_json }}
          repository-owner: ${{ github.repository_owner }}
          repository-name: ${{ github.event.repository.name }}

      - name: Create/Update PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: ${{ inputs.pr_title }}
          title: ${{ inputs.pr_title }}
          body: ${{ inputs.pr_body }}
          branch: autobump/dev
          delete-branch: false
          base: ${{ inputs.cluster_config_base }}
