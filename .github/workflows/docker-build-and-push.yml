name: 'Docker: Build and Push Images (reusable)'

on:
  workflow_call:
    inputs:
      components:
        description: 'JSON array of {component, dockerfile}'
        required: true
        type: string
      push_on_main:
        description: 'Push images on main branch?'
        required: false
        default: true
        type: boolean
    outputs:
      digests-json:
        description: 'JSON object of component digests'
        value: ${{ jobs.collect-digests.outputs.digests-json }}

jobs:
  build:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.component }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ inputs.push_on_main && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Write digest artifact
        if: ${{ inputs.push_on_main && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
        run: |
          echo '{"component":"${{ matrix.component }}","digest":"${{ steps.build.outputs.digest }}"}' > digest-${{ matrix.component }}.json

      - name: Upload digest artifact
        if: ${{ inputs.push_on_main && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: digest-${{ matrix.component }}.json

  collect-digests:
    name: Collect all digests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.push_on_main && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main') }}
    outputs:
      digests-json: ${{ steps.collect.outputs.digests_json }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Collect digests
        id: collect
        run: |
          # Create JSON object from all digest files
          jq -s 'map({(.component): .digest}) | add' digests/digest-*.json > digests.json
          echo "digests_json=$(cat digests.json | jq -c .)" >> $GITHUB_OUTPUT
