name: 'Docker: Retag Images for GA (reusable)'

on:
  workflow_call:
    inputs:
      components:
        description: 'JSON array of {component}'
        required: true
        type: string
      release_type:
        description: 'Type of release: rc or ga'
        default: 'rc'
        type: string
      image_digests_json:
        description: 'JSON object of component -> image digest'
        required: true
        type: string

jobs:
  retag-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(inputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          ver=$(echo "$GITHUB_REF_NAME" | sed -E 's/^.*-v(.*)$/\1/')
          echo "ver=$ver" >> $GITHUB_OUTPUT
          echo "ver_mm=$(echo "$ver" | awk -F. '{print $1"."$2}')" >> $GITHUB_OUTPUT
          
          # Add RC suffix if this is an RC release
          if [ "${{ inputs.release_type }}" = "rc" ]; then
            echo "ver_rc=${ver}-rc" >> $GITHUB_OUTPUT
          else
            echo "ver_rc=$ver" >> $GITHUB_OUTPUT
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag existing image to semver tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Get the digest for this component
          digest=$(echo '${{ inputs.image_digests_json }}' | jq -r ".${{ matrix.component }}")
          
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "Error: No digest found for component ${{ matrix.component }}"
            exit 1
          fi
          
          DST_BASE=ghcr.io/$OWNER/${{ github.event.repository.name }}/${{ matrix.component }}
          SRC="$DST_BASE@$digest"
          
          if [ "${{ inputs.release_type }}" = "rc" ]; then
            # Create RC tags
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_rc }}" "$SRC"
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_mm }}-rc" "$SRC"
          else
            # Create GA tags
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver }}" "$SRC"
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_mm }}" "$SRC"
          fi
