name: 'Docker: Retag Images for GA (reusable)'

on:
  workflow_call:
    inputs:
      components:
        description: 'JSON array of {component}'
        required: true
        type: string
      release_type:
        description: 'Type of release: rc or ga'
        default: 'rc'
        type: string
      release_version:
        description: 'Exact version to use for tags, e.g. 1.8.0-rc.1 or 1.8.0'
        required: true
        type: string
      image_digests_json:
        description: 'JSON object of component -> image digest'
        required: true
        type: string
    outputs:
      tags-json:
        description: 'JSON object of component -> version'
        value: ${{ jobs.emit-tags.outputs.tags-json }}

jobs:
  retag-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(inputs.components) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.release_version }}" ]; then
            echo "::error::release_version is empty. Gate this job on 'chart_release_created == true' (or pass a non-empty version)."
            exit 1
          fi
          if ! jq -e . >/dev/null 2>&1 <<< '${{ inputs.image_digests_json }}'; then
            echo "::error::image_digests_json is not valid JSON"
            exit 1
          fi

      - name: Prepare variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "ver=${{ inputs.release_version }}" >> $GITHUB_OUTPUT
          echo "ver_mm=$(echo "${{ inputs.release_version }}" | sed -E 's/-rc.*$//' | awk -F. '{print $1"."$2}')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag existing image to semver tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Get the digest for this component
          digest=$(jq -r --arg c "${{ matrix.component }}" '.[$c]' <<< '${{ inputs.image_digests_json }}')
          
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "Error: No digest found for component ${{ matrix.component }}"
            exit 1
          fi
          
          # An owner is free to carry a capital, a GHCR path is not, and the
          # build side never hits this because docker/metadata-action folds the
          # case for us. Same treatment as helm-chart-build-and-publish.
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          DST_BASE=ghcr.io/$OWNER_LC/${{ github.event.repository.name }}/${{ matrix.component }}
          SRC="$DST_BASE@$digest"
          
          if [ "${{ inputs.release_type }}" = "rc" ]; then
            # Create RC tags
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver }}" "$SRC"
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_mm }}-rc" "$SRC"
          else
            # Create GA tags
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver }}" "$SRC"
            docker buildx imagetools create --tag "$DST_BASE:${{ steps.vars.outputs.ver_mm }}" "$SRC"
          fi

  emit-tags:
    needs: retag-images
    runs-on: ubuntu-latest
    outputs:
      tags-json: ${{ steps.tags.outputs.tags_json }}
    steps:
      - name: Emit tags map
        id: tags
        run: |
          echo '${{ inputs.components }}' | jq -c --arg v '${{ inputs.release_version }}' '
            map({(.component): $v}) | add
          ' > tags.json
          echo "tags_json=$(cat tags.json)" >> $GITHUB_OUTPUT
